[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
process_name=%(program_name)s_%(process_num)02d
command=php-fpm -F
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=ma7lola
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/php-fpm.log
stopwaitsecs=3600